<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430" font-family="-apple-system, Segoe UI, Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="1180" height="430" rx="16" fill="#f7f9fc"/>
<rect x="30" y="60" width="200" height="120" rx="12" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
<text x="130.0" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">You / AI agent</text>
<text x="130.0" y="116" text-anchor="middle" font-size="15" fill="#333">writes code, runs</text>
<text x="130.0" y="138" text-anchor="middle" font-size="15" fill="#333">git commit / git push</text>
<rect x="300" y="60" width="260" height="120" rx="12" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="430.0" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">commit hooks</text>
<text x="430.0" y="116" text-anchor="middle" font-size="15" fill="#333">pre-commit / commit-msg</text>
<text x="430.0" y="138" text-anchor="middle" font-size="15" fill="#333">gitleaks: secrets</text>
<text x="430.0" y="160" text-anchor="middle" font-size="15" fill="#333">real-name list</text>
<text x="430.0" y="182" text-anchor="middle" font-size="15" fill="#333">author e-mail check</text>
<rect x="630" y="60" width="180" height="120" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
<text x="720.0" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">commit created</text>
<text x="720.0" y="116" text-anchor="middle" font-size="15" fill="#333"></text>
<rect x="880" y="40" width="270" height="160" rx="12" fill="#fff8e1" stroke="#f9ab00" stroke-width="2"/>
<text x="1015.0" y="70" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">pre-push hook</text>
<text x="1015.0" y="96" text-anchor="middle" font-size="15" fill="#333">is the target private?</text>
<text x="1015.0" y="118" text-anchor="middle" font-size="15" fill="#333">public / unconfirmed = refuse</text>
<text x="1015.0" y="140" text-anchor="middle" font-size="15" fill="#333">exception: approve-publish</text>
<line x1="230" y1="120" x2="300" y2="120" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="265.0" y="112.0" text-anchor="middle" font-size="14" fill="#555">git commit</text>
<line x1="560" y1="120" x2="630" y2="120" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="595.0" y="112.0" text-anchor="middle" font-size="14" fill="#555">pass</text>
<line x1="810" y1="120" x2="880" y2="120" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="845.0" y="112.0" text-anchor="middle" font-size="14" fill="#555">git push</text>
<rect x="300" y="260" width="260" height="110" rx="12" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
<text x="430.0" y="290" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">BLOCKED</text>
<text x="430.0" y="316" text-anchor="middle" font-size="15" fill="#333">the commit stops here;</text>
<text x="430.0" y="338" text-anchor="middle" font-size="15" fill="#333">fix the content and retry</text>
<line x1="430" y1="180" x2="430" y2="260" stroke="#d93025" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="430.0" y="240" text-anchor="middle" font-size="14" fill="#d93025">refuse</text>
<path d="M300,315 L130,315 L130,180" fill="none" stroke="#d93025" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="630" y="260" width="220" height="110" rx="12" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
<text x="740.0" y="290" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">private GitHub repo</text>
<text x="740.0" y="316" text-anchor="middle" font-size="15" fill="#333"></text>
<rect x="900" y="260" width="250" height="110" rx="12" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
<text x="1025.0" y="290" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a2e">GitHub Actions</text>
<text x="1025.0" y="316" text-anchor="middle" font-size="15" fill="#333">full-history scan</text>
<text x="1025.0" y="338" text-anchor="middle" font-size="15" fill="#333">(the last line of defense)</text>
<line x1="1015" y1="200" x2="1015" y2="225" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M1015,200 L740,200 L740,260" fill="none" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="850" y1="315" x2="900" y2="315" stroke="#555" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="875.0" y="307.0" text-anchor="middle" font-size="14" fill="#555">pass</text>
<rect x="30" y="392" width="1120" height="0" fill="none"/>
<text x="590.0" y="405" text-anchor="middle" font-size="14" fill="#555">setup: leakguard init installs hooks, rules and CI into any repo  •  audit: pre-publication check (PASS / WARN / BLOCK)</text>
</svg>
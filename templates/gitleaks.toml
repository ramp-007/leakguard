# leakguard-managed: refresh with `leakguard.py init --update`; repo-specific rules do not belong here
title = "leakguard"

# Without [extend] a custom config would run ONLY the rules below; useDefault keeps gitleaks' ~200 secret rules.
[extend]
useDefault = true

# Obsidian plugin bundles (minified, multi-MB) are third-party code; scanning them dominated memory use.
[[allowlists]]
description = "Obsidian plugin bundles and caches"
paths = [
  '''(^|/)\.obsidian/plugins/''',
  '''(^|/)\.smart-env/''',
]

# ---- personal / environment information (placeholders are allow-listed per rule) ----

[[rules]]
id = "personal-email"
description = "E-mail address (use dev@example.com or a GitHub noreply address)"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}'''
keywords = ["@"]
[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''@example\.(?:com|org|net)$''',
  '''@users\.noreply\.github\.com$''',
  '''^noreply@anthropic\.com$''',
  '''^git@github\.com$''',
]

[[rules]]
id = "private-ip"
description = "Private / Tailscale IPv4 address (use 192.168.1.20, 192.168.1.30 or 100.64.0.x placeholders)"
regex = '''\b(?:10(?:\.\d{1,3}){3}|192\.168(?:\.\d{1,3}){2}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}|100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])(?:\.\d{1,3}){2})\b'''
keywords = ["10.", "192.168", "172.", "100."]
[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''^192\.168\.1\.(?:20|30)$''',
  '''^100\.64\.0\.\d{1,3}$''',
  '''^10\.0\.0\.\d{1,3}$''',
]

[[rules]]
id = "home-directory"
description = "A user's home directory path reveals the user name (use <user> or a placeholder)"
regex = '''(?i)(?:\b[A-Z]:\\{1,2}Users\\{1,2}[^\\\s"'<>|:*?]+|/(?:home|Users)/[A-Za-z_][A-Za-z0-9_.-]*)'''
keywords = ["users", "/home/"]
[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''(?i)Users\\{1,2}(?:Public|Default|All Users|user|sshuser|you|name|username|<user>)$''',
  '''/(?:home|Users)/(?:user|sshuser|serveruser|runner|you|name|username|Shared)$''',
]

[[rules]]
id = "tailnet-hostname"
description = "Tailscale MagicDNS name (*.ts.net) reveals the tailnet"
regex = '''[A-Za-z0-9.-]+\.ts\.net\b'''
keywords = [".ts.net"]

[[rules]]
id = "windows-default-hostname"
description = "Windows default computer name (DESKTOP-XXXXXXX)"
regex = '''\b(?:DESKTOP|LAPTOP)-[A-Z0-9]{7}\b'''
keywords = ["desktop-", "laptop-"]
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''^(?:DESKTOP|LAPTOP)-(?:0000000|XXXXXXX)$''']

[[rules]]
id = "mac-address"
description = "MAC address"
regex = '''\b(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}\b'''
keywords = [":", "-"]
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''^(?:00[:-]){5}00$''', '''^(?:(?i:ff)[:-]){5}(?i:ff)$''']

[[rules]]
id = "ssh-public-key"
description = "SSH public key (identifies the user)"
regex = '''ssh-(?:ed25519|rsa|dss)\s+AAAA[0-9A-Za-z+/=]{20,}'''
keywords = ["ssh-"]
